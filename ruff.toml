target-version = "py312"
line-length = 100
extend-exclude = [
    "packages/shared/migrations/versions",
    ".venv",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[lint.per-file-ignores]
"packages/shared/migrations/*" = ["E402", "UP"]
"scripts/*" = ["E402"]
"**/tests/*" = ["B", "SIM"]
