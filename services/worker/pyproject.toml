[project]
name = "doc-search-worker"
version = "0.0.0"
description = "Doc-Search MCP worker: pulls jobs from SQS, emits ProcessedDocument batches."
requires-python = ">=3.12"
dependencies = [
    "doc-search-shared",
    "boto3>=1.35",
    "botocore>=1.35",
    "httpx>=0.27",
    "pydantic>=2.9",
    "structlog>=24.4",
    "mistune>=3.0",
    "python-frontmatter>=1.1",
    "pygit2>=1.15",
    "prance>=23.6",
    "openapi-spec-validator>=0.7",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_search_worker"]
