[project]
name = "doc-search-worker"
version = "0.0.0"
description = "Doc-Search MCP worker: pulls jobs from SQS, emits ProcessedDocument batches."
requires-python = ">=3.12"
dependencies = [
    "doc-search-shared",
    "boto3>=1.35",
    "botocore>=1.35",
    "httpx>=0.27",
    "pydantic>=2.9",
    "structlog>=24.4",
    "mistune>=3.0",
    "python-frontmatter>=1.1",
    "pygit2>=1.15",
    "prance>=23.6",
    "openapi-spec-validator>=0.7",
    "PyYAML>=6.0",
    "trafilatura>=2.0",
    "selectolax>=0.3",
]

[project.optional-dependencies]
# Heavy profile only: Chromium-backed crawl + Playwright + Docling.
# Installed into Dockerfile.heavy; the light image must never carry this
# weight (Crawl4AI pulls Chromium, Docling pulls ~1-2 GB of model weights).
heavy = [
    "crawl4ai>=0.4",
    "playwright>=1.47",
    "docling>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_search_worker"]
