[project]
name = "doc-search-ingest"
version = "0.0.0"
description = "Doc-Search MCP ingest API: register/refresh libraries, GitHub webhooks, scheduler."
requires-python = ">=3.12"
dependencies = [
    "doc-search-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mangum>=0.19",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "boto3>=1.35",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_search_ingest"]
